<body onload="start505Host();">
    <script>
        var host505Started = false;
        var host505Watchdog = null;

        function storage505Get(name, fallback) {
            try {
                var value = localStorage.getItem(name);
                return value === null ? fallback : value;
            } catch (error) {
                return fallback;
            }
        }

        function storage505Set(name, value) {
            try { localStorage.setItem(name, String(value)); } catch (error) {}
        }

        function storage505Remove(name) {
            try { localStorage.removeItem(name); } catch (error) {}
        }

        function session505Get(name) {
            try { return sessionStorage.getItem(name); } catch (error) { return null; }
        }

        function session505Set(name, value) {
            try { sessionStorage.setItem(name, String(value)); } catch (error) {}
        }

        function session505Remove(name) {
            try { sessionStorage.removeItem(name); } catch (error) {}
        }

        function status505(message) {
            var element = document.getElementById('msgs2');
            if (element) element.textContent = message;
        }

        function isSupported505() {
            var ua = navigator.userAgent || '';
            return /PlayStation 4/i.test(ua) &&
                /PlayStation\s+4[\/ ]5\.05(?:[^0-9]|$)/i.test(ua);
        }

        function run505Once() {
            if (host505Started) return;
            host505Started = true;
            status505('Iniciando exploit...');
            try {
                exploit();
            } catch (error) {
                status505('Falha na inicialização. Recarregue o navegador antes de tentar novamente.');
                var menuMessage = document.getElementById('msgs');
                if (menuMessage) {
                    menuMessage.textContent = error && error.message ?
                        error.message : String(error);
                }
            }
        }

        function start505Host() {
            if (!isSupported505()) {
                status505('Dispositivo ou firmware não suportado. PS4 5.05 é necessário.');
                return;
            }

            var ac = window.applicationCache;
            var hasManifest = document.documentElement.hasAttribute('manifest');
            if (!ac || !hasManifest) {
                status505('Cache offline indisponível. Iniciando modo online...');
                setTimeout(run505Once, 250);
                return;
            }

            var finished = false;
            function finish() {
                if (finished) return false;
                finished = true;
                if (host505Watchdog !== null) {
                    clearTimeout(host505Watchdog);
                    host505Watchdog = null;
                }
                return true;
            }

            function ready(message) {
                if (!finish()) return;
                storage505Set('cached505', 'yes');
                session505Remove('cacheReload505');
                status505(message);
                setTimeout(run505Once, 500);
            }

            function updateReady() {
                if (!finish()) return;
                storage505Set('cached505', 'yes');
                try { ac.swapCache(); } catch (error) {}
                if (session505Get('cacheReload505') !== 'yes') {
                    session505Set('cacheReload505', 'yes');
                    status505('Cache atualizado. Recarregando uma vez...');
                    setTimeout(function () { window.location.reload(); }, 750);
                } else {
                    status505('Cache atualizado. Iniciando...');
                    setTimeout(run505Once, 500);
                }
            }

            function cacheError() {
                if (!finish()) return;
                storage505Remove('cached505');
                status505('Falha no cache offline. Verifique a conexão e tente novamente manualmente.');
            }

            ac.addEventListener('downloading', function () {
                status505('Instalando cache offline...');
            }, false);
            ac.addEventListener('progress', function (event) {
                if (event && event.total > 0) {
                    status505('Instalando Cache Offline: ' +
                        Math.round(100 * event.loaded / event.total) + '%');
                }
            }, false);
            ac.addEventListener('cached', function () {
                ready('Cache instalado. Iniciando...');
            }, false);
            ac.addEventListener('noupdate', function () {
                ready('Cache offline pronto. Iniciando...');
            }, false);
            ac.addEventListener('updateready', updateReady, false);
            ac.addEventListener('error', cacheError, false);
            ac.addEventListener('obsolete', function () {
                if (!finish()) return;
                storage505Remove('cached505');
                status505('O cache offline está obsoleto. Limpe os dados do navegador e recarregue.');
            }, false);

            if (ac.status === ac.UPDATEREADY) {
                updateReady();
            } else if (ac.status === ac.IDLE) {
                ready('Cache offline pronto. Iniciando...');
            } else {
                status505('Aguardando cache offline...');
                host505Watchdog = setTimeout(function () {
                    if (!finish()) return;
                    status505('Tempo limite de verificação do cache esgotado. Tente novamente manualmente.');
                }, 60000);
            }
        }
    </script>

    <script>
        function success() {
            document.getElementById("menu").style.display = "block";
            document.getElementById("progress").style.display = "none";
            document.getElementById("controls").style.display = "block";
        }

        function allset() {
            msgs.innerHTML = LoadedMSG;
        }

        var payloadBusy = false;
        var PLfile = null;
        var LoadedMSG = '';
        var runPAYLOAD1 = null;
        var allowedPayloads = {
            'goldhen.bin': true,
            'goldhen10.bin': true,
            'ftp.bin': true,
            'ps4debug.bin': true,
            'app2usb.bin': true,
            'backup.bin': true,
            'restore.bin': true,
            'disable-updates.bin': true,
            'enable-updates.bin': true,
            'rif-renamer.bin': true,
            'Kernel-Clock.bin': true,
            'appcache-install.bin': true,
            'history-blocker.bin': true,
            'pup-decrypt.bin': true
        };

        function payloadError(message) {
            payloadBusy = false;
            msgs.textContent = message;
        }

        function load_payload() {
            if (payloadBusy) return;
            if (!allowedPayloads[PLfile]) {
                payloadError('Payload desconhecido selecionado. Recarregue o host.');
                return;
            }

            payloadBusy = true;
            var requestedPayload = PLfile;
            var req1 = new XMLHttpRequest();
            req1.open('GET', requestedPayload, true);
            req1.responseType = 'arraybuffer';
            req1.timeout = 15000;
            req1.ontimeout = function () {
                payloadError('Tempo limite da solicitação do payload esgotado. Recarregue antes de tentar novamente.');
            };
            req1.onerror = function () {
                payloadError('Falha na solicitação do payload. Verifique os arquivos em cache do host.');
            };
            req1.onabort = function () {
                payloadError('A solicitação do payload foi cancelada. Recarregue antes de tentar novamente.');
            };
            req1.onreadystatechange = function () {
                if (req1.readyState !== 4) return;
                req1.onreadystatechange = null;
                if (req1.status !== 200 || !req1.response ||
                    req1.response.byteLength === 0) {
                    payloadError('O arquivo do payload está indisponível. Não continue.');
                    return;
                }
                if (req1.response.byteLength > 0x200000) {
                    payloadError('O payload é muito grande para a área de memória reservada.');
                    return;
                }

                try {
                    var paddingSize = (4 - (req1.response.byteLength % 4)) % 4;
                    var padding1 = new Uint8Array(paddingSize);
                    var tmp1 = new Uint8Array(req1.response.byteLength + padding1.byteLength);
                    tmp1.set(new Uint8Array(req1.response), 0);
                    tmp1.set(padding1, req1.response.byteLength);
                    var shellcode1 = new Uint32Array(tmp1.buffer);
                    var code_addr1 = new int64(0x26100000, 0x00000009);
                    p.syscall(477, code_addr1, 0x300000, 7, 0x41000, -1, 0);
                    for (var i = 0; i < shellcode1.length; i++) {
                        p.write4(code_addr1.add32(0x100000 + i * 4), shellcode1[i]);
                    }
                    runPAYLOAD1 = function () {
                        p.fcall(code_addr1);
                        PLfile = null;
                        for (var x = 0; x < 0x300000; x += 8) {
                            p.write8(code_addr1.add32(x), 0);
                        }
                        payloadBusy = false;
                        runPAYLOAD1 = null;
                        setTimeout(allset, 50);
                    };
                    setTimeout(runPAYLOAD1, 100);
                } catch (error) {
                    payloadError('Falha na execução do payload. Recarregue antes de tentar novamente.');
                }
            };
            req1.send(null);
        }
